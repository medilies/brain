name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The nerve commit this Brain is checked with.
  NERVE: 41b82abac1ce806ab67430179cfc5f6d0e4da40b

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run github.com/medilies/nerve/cmd/nerve@${NERVE} check
