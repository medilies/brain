name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: nerve check, at the nerve commit this Brain uses
        run: go run github.com/medilies/nerve/cmd/nerve@v0.3.1-0.20261121221339-e860cda4e81c check
      - name: Own skills defer to the project
        run: |
          missing=$(grep -L '^## Project overrides$' skills/*/SKILL.md || true)
          test -z "$missing" || { echo "no ## Project overrides section in:"; echo "$missing"; exit 1; }
